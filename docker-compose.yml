name: ordermind

x-backend: &backend
  image: ordermind-php:dev
  build:
    context: .
    dockerfile: docker/php.Dockerfile
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  working_dir: /app
  volumes:
    - ./backend:/app
  environment:
    COMPOSER_HOME: /tmp/composer
  init: true

services:
  database:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ordermind
      POSTGRES_USER: ordermind
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordermind -d ordermind"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  database-test:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ordermind_test
      POSTGRES_USER: ordermind_test
      POSTGRES_PASSWORD: local-test-only
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordermind_test -d ordermind_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/health') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  queue:
    <<: *backend
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=60"]
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 70s

  frontend:
    image: node:22.23.3-bookworm-slim
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      npm_config_cache: /tmp/npm
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  postgres_test_data:
